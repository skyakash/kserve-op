---
# One-shot bootstrap Job that creates the "models" bucket inside Minio
# and uploads model.joblib (mounted from the iris-model-seed ConfigMap)
# at the exact S3 key the LocalModelCache expects.
#
# The S3 key MUST match LocalModelCache.spec.sourceModelUri:
#   s3://models/sklearn/iris/1.0/model.joblib
#                         ^^^^^^^^^^^^^^^^^^^
#                         bucket="models", key="sklearn/iris/1.0/model.joblib"
#
# BEFORE applying this Job, create the seed ConfigMap with the model:
#   kubectl create configmap -n minio iris-model-seed \
#     --from-file=model.joblib=06-sample-model/airgap-localmodelcache/model.joblib
#
# The Job is idempotent — `mc mb --ignore-existing` and `mc cp` overwrite —
# so re-running it is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: minio
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        purpose: minio-bootstrap
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Waiting for Minio at http://minio:9000/minio/health/ready ..."
              until wget -qO- http://minio:9000/minio/health/ready >/dev/null 2>&1; do
                echo "  not ready yet — sleeping 2s"
                sleep 2
              done
              echo "Minio is ready."
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-10-08T09-37-26Z
          envFrom:
            - secretRef:
                name: minio-root-creds
          command:
            - /bin/sh
            - -c
            - |
              set -eux
              # mc alias set self <endpoint> <user> <pass>
              mc alias set self http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              # Create bucket (idempotent)
              mc mb --ignore-existing self/models
              # Upload the iris model under the exact key the LocalModelCache
              # sourceModelUri targets. --quiet to keep logs short.
              mc cp /seed/model.joblib self/models/sklearn/iris/1.0/model.joblib
              # Confirm
              mc ls self/models/sklearn/iris/1.0/
              echo "Bootstrap complete."
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed
          configMap:
            name: iris-model-seed
            items:
              - key: model.joblib
                path: model.joblib
