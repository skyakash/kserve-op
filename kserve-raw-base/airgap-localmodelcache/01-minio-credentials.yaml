---
# Minio root credentials.
#
# !!! DEV / DEMO ONLY !!!
#
# These are static "minioadmin / minioadmin" credentials and the values
# are hard-coded in this YAML. Acceptable for a one-off air-gap demo
# inside an isolated cluster. NOT acceptable for any environment that
# might be reachable from outside the cluster. For production:
#   - Generate strong unique credentials.
#   - Store them in a Secret created out-of-band (e.g. by your secret
#     management tooling), not committed to git.
#   - Rotate them on a schedule.
#
# minioadmin = base64 -> bWluaW9hZG1pbg==
apiVersion: v1
kind: Secret
metadata:
  name: minio-root-creds
  namespace: minio
type: Opaque
data:
  MINIO_ROOT_USER: bWluaW9hZG1pbg==
  MINIO_ROOT_PASSWORD: bWluaW9hZG1pbg==
