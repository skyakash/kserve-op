---
# S3 credentials used by the LocalModelCache *download Job* to authenticate
# to Minio. This Secret is referenced from the ClusterStorageContainer in
# 06-clusterstoragecontainer-s3.yaml.
#
# Namespace MUST be `kserve-localmodel-jobs` — that's where the localmodel
# controller creates the download Jobs (per the bundled ConfigMap field
# `localModel.jobNamespace`). A Secret in any other namespace would not
# be visible to the Job pod.
#
# Keys are the canonical AWS-SDK env-var names — they are loaded into the
# Job container's env via `envFrom: secretRef:` in the ClusterStorageContainer.
#
# !!! DEV / DEMO ONLY — see warning in 01-minio-credentials.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3-credentials
  namespace: kserve-localmodel-jobs
type: Opaque
data:
  # minioadmin
  AWS_ACCESS_KEY_ID: bWluaW9hZG1pbg==
  AWS_SECRET_ACCESS_KEY: bWluaW9hZG1pbg==
