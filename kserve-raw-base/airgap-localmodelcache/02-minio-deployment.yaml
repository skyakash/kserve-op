---
# Single-replica Minio Deployment. /data is backed by an emptyDir for
# the dev/kind-cluster case — this is per-pod and dies if Minio
# reschedules. For real air-gap, replace this with a PersistentVolumeClaim
# bound to your CSI-backed StorageClass (e.g. EBS, GCE PD, OpenShift
# LocalVolume) so the bucket survives pod restarts.
#
# We pin to a known-good Minio tag. If you mirror images for an
# air-gapped cluster, mirror this exact tag along with the operator
# images via your registry pipeline (e.g. mirror-images.sh — but that
# script targets the operator/KServe images; Minio you mirror yourself
# once with: docker pull quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
# && docker push <your-registry>/minio/minio:RELEASE.2024-10-13T13-34-11Z
# and then update the image: field below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          envFrom:
            - secretRef:
                name: minio-root-creds
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
