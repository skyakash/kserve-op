---
# Air-gapped LocalModelCache pointing at the in-cluster Minio bucket.
#
# This reuses LocalModelNodeGroup `default-worker` from the existing
# sample at 06-sample-model/localmodelcache-nodegroup.yaml — apply that
# first if you haven't already.
#
# The download Job that fetches the model is selected via the
# ClusterStorageContainer in 06-clusterstoragecontainer-s3.yaml (matches
# on `s3://` prefix + workloadType=localModelDownloadJob).
apiVersion: serving.kserve.io/v1alpha1
kind: LocalModelCache
metadata:
  name: sklearn-iris-cache-airgap
spec:
  # The S3 key path here must match what 04-minio-bootstrap-job.yaml uploads.
  sourceModelUri: s3://models/sklearn/iris/1.0/model.joblib
  modelSize: 100Mi
  nodeGroups:
    - default-worker
